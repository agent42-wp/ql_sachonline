server {
    listen 80 default_server;
    server_name 192.168.100.20 _;
    server_tokens off;

    root /opt/sachonline/frontend;
    index index.html;

    # Security headers (OWASP hardening)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self';" always;

    # Phục vụ trực tiếp giao diện tĩnh HTML/CSS/JS
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy toàn bộ REST API về FastAPI đang lắng nghe nội bộ 127.0.0.1:8000
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
